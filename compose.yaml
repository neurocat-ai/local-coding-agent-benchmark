name: local-dev-agent-lab

services:
  ollama:
    image: "${OLLAMA_IMAGE:-ollama/ollama:latest}"
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
      - ./models:/profiles:ro
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_CONTEXT_LENGTH: "${OLLAMA_CONTEXT_LENGTH:-32768}"
      OLLAMA_KEEP_ALIVE: "${OLLAMA_KEEP_ALIVE:-15m}"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-guard_erp}"
      POSTGRES_USER: "${POSTGRES_USER:-guard_erp}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-local-lab-only}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  openhands:
    # Agent Canvas 1.16.0 with bundled agent-server/SDK 1.44.0.
    image: "${OPENHANDS_IMAGE:-ghcr.io/openhands/agent-canvas@sha256:862d1842f7935ff19a252c22260fdeeb47ba0a6fd5b18438a7aa46e1de271d22}"
    profiles: ["openhands"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:${OPENHANDS_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      LOG_ALL_EVENTS: "true"
      LLM_API_KEY: "${LOCAL_LLM_API_KEY:-local-lab}"
      LLM_BASE_URL: "http://host.docker.internal:${OLLAMA_PORT:-11434}/v1"
      LLM_MODEL: "openai/${OPENHANDS_MODEL_PROFILE:-qwen36-q8}"
      SANDBOX_VOLUMES: "${PWD}/.runs:/workspace:rw"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - openhands-state:/.openhands
      - ./.runs:/workspace:rw
    depends_on:
      ollama:
        condition: service_healthy

  demo-tests:
    image: mcr.microsoft.com/dotnet/sdk:8.0
    profiles: ["tests"]
    working_dir: /workspace
    command: ["dotnet", "test", "GuardErp.sln", "--nologo"]
    volumes:
      - ./demo/guard-erp:/workspace:rw
      - nuget-cache:/root/.nuget/packages

volumes:
  ollama-data:
  postgres-data:
  openhands-state:
  nuget-cache:
